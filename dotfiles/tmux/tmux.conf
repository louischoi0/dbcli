# True color: tell tmux the outer terminal takes 24-bit colors, so apps (dbcli) get them as written
set -as terminal-features ',xterm*:RGB'

# Status line: dark navy bar, light text. Sky blue blocks (#8cc8ec) mark the session name and
# the clock; the current window is a white tab.
set -g status-style 'bg=#0b3954,fg=#e6f2fa'
set -g status-left-length 30
set -g status-left '#[bg=#8cc8ec,fg=#000000,bold] #S #[default] '
set -g window-status-separator ''
set -g window-status-format ' #I:#W#{?window_flags,#{window_flags}, } '
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag, Z,} '
set -g window-status-current-style 'bg=#ffffff,fg=#000000,bold'

# Right side: Claude Code session info (model, effort, context, limits) of the active pane,
# then the pane title, then the clock.
# ~/.claude/statusline-tmux.sh stores the info, already styled, on each Claude pane as
# @claude_info; shown only while that pane is running claude.
# The pane title is left out while it is only the default "Claude Code" (before the session has a topic).
set -g status-right-length 150
set -g status-right '#{?#{&&:#{==:#{pane_current_command},claude},#{@claude_info}},#{@claude_info}  ,}#{?#{m:*Claude Code,#{pane_title}},,#{=/32/…:pane_title}  }#[bg=#8cc8ec,fg=#000000,bold] %H:%M #[nobold]%d-%b '

# Already on in the running tmux server (set by hand before): kept here so a new server has them too.
# Distinct modified keys (dbcli's Ctrl+Enter), see oracle-cli/MANUAL.md
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Korean input (2-beolsik): Ctrl+ㅊ acts as Ctrl+C, and so on for every jamo key.
# With extended keys on, the terminal sends Ctrl+<jamo> as its own key, which tmux would pass on as
# the bare jamo; these turn it back into Ctrl+<the Latin letter on that key>.
bind -n C-ㅂ send-keys C-q
bind -n C-ㅈ send-keys C-w
bind -n C-ㄷ send-keys C-e
bind -n C-ㄱ send-keys C-r
bind -n C-ㅅ send-keys C-t
bind -n C-ㅛ send-keys C-y
bind -n C-ㅕ send-keys C-u
bind -n C-ㅑ send-keys C-i
bind -n C-ㅐ send-keys C-o
bind -n C-ㅔ send-keys C-p
bind -n C-ㅁ send-keys C-a
bind -n C-ㄴ send-keys C-s
bind -n C-ㅇ send-keys C-d
bind -n C-ㄹ send-keys C-f
bind -n C-ㅎ send-keys C-g
bind -n C-ㅗ send-keys C-h
bind -n C-ㅓ send-keys C-j
bind -n C-ㅏ send-keys C-k
bind -n C-ㅣ send-keys C-l
bind -n C-ㅋ send-keys C-z
bind -n C-ㅌ send-keys C-x
bind -n C-ㅊ send-keys C-c
bind -n C-ㅍ send-keys C-v
bind -n C-ㅜ send-keys C-n
bind -n C-ㅡ send-keys C-m
# Ctrl+ㅠ is Ctrl+B, tmux's prefix: it starts a tmux command as Ctrl+B does
bind -n C-ㅠ switch-client -T prefix
